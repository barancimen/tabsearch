<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Text Search</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button id="v-search" class="view" type="button" role="tab" aria-selected="true" aria-controls="results">Search</button>
        <button id="v-live" class="view" type="button" role="tab" aria-selected="false" aria-controls="cats" title="Every tab, most like the one you are looking at first">Live</button>
        <button id="v-windows" class="view" type="button" role="tab" aria-selected="false" aria-controls="cats">Windows</button>
        <button id="v-subjects" class="view" type="button" role="tab" aria-selected="false" aria-controls="cats">Subjects</button>
        <button id="refresh" type="button" title="Reindex: read every tab again" aria-label="Reindex">↻</button>
      </nav>
      <!-- the domain filter serves every view, and keeps its text across them -->
      <div id="domrow" class="combo">
        <input
          id="dom"
          class="box"
          type="search"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="domlist"
          placeholder="All domains, or filter to x.com"
          autocomplete="off"
          spellcheck="false"
        />
        <ul id="domlist" role="listbox" aria-label="Domains of open tabs" hidden></ul>
      </div>
      <div id="searchbar">
        <div class="row">
          <input
            id="q"
            class="box"
            type="search"
            placeholder="Search the text of all open tabs"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="row">
          <button id="cs" class="opt" type="button" title="Match case">Aa</button>
          <button id="ww" class="opt" type="button" title="Whole word">Word</button>
          <button id="re" class="opt" type="button" title="Regular expression">.*</button>
          <span id="count"></span>
        </div>
      </div>
      <div id="catnote" hidden></div>
      <details id="catopts" hidden>
        <summary title="Set up the model, and change how tabs are grouped and named. Each change regroups at once.">Adjustments</summary>
        <div id="modelbox" title="Tabs are grouped by meaning with MongoDB's mdbr-leaf-mt model, which runs on this computer. No page text is sent anywhere. Without the model, tabs are grouped by the words they share.">
          <div class="settop"><span class="setname">Meaning model</span></div>
          <div id="modelstate"></div>
          <div class="row">
            <input
              id="modelfolder"
              class="box"
              type="text"
              placeholder="Folder with the model"
              autocomplete="off"
              spellcheck="false"
              title="A folder on this computer that holds mdbr-leaf-mt: tokenizer.json, and onnx/model_quantized.onnx with its _data file. A Hugging Face download folder works too. The extension needs permission to read files: in chrome://extensions, open Details for Tab Text Search and turn on &quot;Allow access to file URLs&quot;."
            />
            <button id="modeluse" type="button" title="Load the model from this folder. Empty the box and press this to stop using a folder.">Use folder</button>
          </div>
          <div class="row">
            <button id="modeldl" type="button" title="Download the model from Hugging Face and keep it in the extension's storage. Only the model's files are fetched. Nothing about your tabs is sent.">Download the model</button>
            <button id="modelrm" type="button" title="Delete the downloaded model from the extension's storage" hidden>Remove the download</button>
          </div>
        </div>
        <div id="catmode"></div>
        <div id="catsliders"></div>
        <div class="row optbar">
          <button id="catreset" type="button" title="Put every setting back to how it started">Set all to default</button>
        </div>
      </details>
      <div id="status"></div>
      <div id="bad" hidden></div>
    </header>
    <main id="results" tabindex="-1"></main>
    <main id="cats" tabindex="-1" hidden></main>
    <script src="db.js"></script>
    <script src="cluster.js"></script>
    <script src="model.js"></script>
    <script src="sidepanel.js"></script>
    <script src="categories.js"></script>
  </body>
</html>
